name: PR CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  codespell:
    name: Codespell
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v4.2.2

      - name: Install codespell
        run: python -m pip install --disable-pip-version-check codespell==2.4.3

      - name: Run codespell
        run: git ls-files -z | xargs -0 codespell

  csharp-check:
    name: C# check
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4.2.2

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v4.4.0
        with:
          dotnet-version: 10.0.x

      - name: Build solution
        run: dotnet build .\Spelljammer.slnx --configuration Release /p:ContinuousIntegrationBuild=true
